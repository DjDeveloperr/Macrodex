name: iOS

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PROJECT: Macrodex.xcodeproj
  SCHEME: Macrodex
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
  DERIVED_DATA_PATH: .ci/DerivedData
  ASC_TESTFLIGHT_GROUPS: ${{ vars.ASC_TESTFLIGHT_GROUPS }}
  IOS_PROFILE_NAME: ${{ vars.IOS_APP_STORE_PROFILE_NAME }}
  IOS_CODE_SIGN_IDENTITY: ${{ vars.IOS_CODE_SIGN_IDENTITY || 'iPhone Distribution' }}
  XCODE_APP: /Applications/Xcode_26.4.1.app

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Required Xcode is not installed at $XCODE_APP"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Restore Xcode caches
        uses: actions/cache@v4
        with:
          path: |
            .ci/DerivedData/SourcePackages
            .ci/DerivedData/Build/Intermediates.noindex
            .ci/DerivedData/Build/Products
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('Macrodex.xcodeproj/project.pbxproj', 'Macrodex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA_PATH"

      - name: Build simulator app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS=arm64 \
          CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app artifact
        uses: NativeScript/SimDeck/actions/upload-ios-simulator-app@main
        with:
          app-glob: ${{ env.DERIVED_DATA_PATH }}/Build/Products/Debug-iphonesimulator/*.app

      - name: Validate App Store Connect secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in \
            ASC_APP_ID \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            DEVELOPMENT_TEAM \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for TestFlight uploads"
              missing=1
            fi
          done

          if [ -z "${ASC_PRIVATE_KEY:-}" ] && [ -z "${ASC_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::ASC_PRIVATE_KEY or ASC_PRIVATE_KEY_B64 is required for TestFlight uploads"
            missing=1
          fi

          exit "$missing"

      - name: Prepare App Store Connect key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          if [ -n "${ASC_PRIVATE_KEY_B64:-}" ]; then
            printf "%s" "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          else
            printf "%s" "$ASC_PRIVATE_KEY" > "$key_path"
          fi

          chmod 600 "$key_path"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install App Store signing assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          decode_base64() {
            local output="$1"
            python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["BASE64_INPUT"]))' "$output"
          }

          signing_dir="$RUNNER_TEMP/signing"
          mkdir -p "$signing_dir"

          BASE64_INPUT="$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
          export BASE64_INPUT
          decode_base64 "$signing_dir/certificate.p12"

          keychain_password="$(openssl rand -base64 32)"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$signing_dir/certificate.p12" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

          if [ -n "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64:-}" ] && [ -n "${IOS_PROFILE_NAME:-}" ]; then
            BASE64_INPUT="$IOS_APP_STORE_PROVISIONING_PROFILE_BASE64"
            export BASE64_INPUT
            decode_base64 "$signing_dir/profile.mobileprovision"

            profile_plist="$signing_dir/profile.plist"
            security cms -D -i "$signing_dir/profile.mobileprovision" > "$profile_plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
            profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

            expected_app_id="${DEVELOPMENT_TEAM}.com.dj.Macrodex"
            if [ "$profile_app_id" != "$expected_app_id" ]; then
              echo "::error::Provisioning profile is for $profile_app_id, expected $expected_app_id"
              exit 1
            fi

            if [ "$profile_name" != "$IOS_PROFILE_NAME" ]; then
              echo "::error::Provisioning profile name is $profile_name, expected $IOS_PROFILE_NAME"
              exit 1
            fi

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$signing_dir/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
            echo "Installed App Store profile $profile_name ($profile_uuid)"
          else
            echo "No static App Store profile configured; Xcode automatic provisioning will create/update profiles."
          fi

          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Set TestFlight build number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          build_number="$(date -u +'%Y%m%d%H%M')"
          echo "TF_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Using TestFlight build number $build_number"

      - name: Archive release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Keep the archive itself unsigned. The export step performs App Store
          # signing; forcing a distribution identity here leaks into SwiftPM
          # package targets and causes provisioning conflicts.
          xcodebuild clean archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Macrodex.xcarchive" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$TF_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            IOS_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH"

      - name: Export IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $DEVELOPMENT_TEAM" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Macrodex.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH"

      - name: Install App Store Connect CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          brew update
          if brew list asc >/dev/null 2>&1; then
            brew upgrade asc
          else
            brew install asc
          fi
          asc --version

      - name: Upload to TestFlight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_UPLOAD_TIMEOUT_SECONDS: "1800"
        run: |
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No IPA was exported"
            exit 1
          fi

          upload_args=(
            publish testflight
            --app "$ASC_APP_ID"
            --ipa "$ipa_path"
            --build-number "$TF_BUILD_NUMBER"
            --wait
            --timeout 45m
            --submit
            --confirm
            --notify
            --test-notes "Latest public beta build from GitHub."
            --locale en-US
            --pretty
          )

          if [ -n "${ASC_TESTFLIGHT_GROUPS:-}" ]; then
            upload_args+=(--group "$ASC_TESTFLIGHT_GROUPS")
          fi

          asc "${upload_args[@]}"

      - name: Upload IPA artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Macrodex-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Delete signing keychain
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH"
          fi
